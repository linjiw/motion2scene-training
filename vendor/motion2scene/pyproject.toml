[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "motion2scene"
version = "0.1.0"
description = "Learning critical 3D traversal scenes from executable humanoid motion"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/motion2scene"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
